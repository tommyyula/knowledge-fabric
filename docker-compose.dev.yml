# Local development only -- never used to build or run the production image
# (.dockerignore excludes this file from the build context).
#
# Credentials match scripts/smoke-ontology-postgres.mjs so one connection string
# works for both:
#   DATABASE_URL=postgresql://ontology:ontology@127.0.0.1:55432/ontology
#
# DB_HOST_PORT must live in the project-root .env: docker compose reads only
# .env for interpolation, not .env.local / .env.private.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ontology
      POSTGRES_DB: ontology
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    volumes:
      - knowledge-fabric-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  knowledge-fabric-db:
